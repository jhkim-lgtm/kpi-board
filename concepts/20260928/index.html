<head>

</head>
<body>
  <header class="review-head">
    <div><p class="eyebrow">1%CLUB / DESIGN REVIEW</p><h1>챔피언의 무대, 성장의 타워.</h1><p class="review-sub">18번 시상대와 20번 타워에서 확장한 시안 21–30. 국기와 함께 성장의 순간을 확인하세요.</p></div>
    <a class="live-link" href="../../">운영 대시보드 ↗</a>
  </header>
  <nav class="collections" aria-label="시안 묶음 선택">
    <button data-view="stage">시상대 × 타워 21–30 <span>NEW</span></button>
    <button data-view="monitor">모니터 시안 11–20 <span>ANIMATED</span></button>
    <button data-view="more">시안 06–10</button>
    <button data-view="overview">기존 시안 01–05</button>
  </nav>
  <nav class="tabs" aria-label="시안 선택"></nav>
  <main>
    <div id="monitor-controls" class="monitor-controls" hidden>
      <button id="monitor-fullscreen">전체화면으로 보기</button>
      <button id="monitor-play">자동 순환</button>
      <button id="monitor-motion">움직임 일시정지</button>
      <button id="monitor-demo" aria-pressed="false">비상·축하 효과 데모</button>
      <label for="monitor-rule">비상 기준</label>
      <select id="monitor-rule"><option value="one-percent">전일 1% 이상 감소</option><option value="any-drop">전일 한 명 이상 감소</option><option value="three-days">3일 연속 감소</option></select>
      <p class="monitor-notice" id="monitor-notice">디자인 시안 · 표시된 조회 시점 데이터 · 문구는 이 브라우저에 저장 · 전체화면에서 ← → 전환 / Esc 종료</p>
    </div>
    <section id="gallery" class="gallery" aria-label="대시보드 시안 미리보기"></section>
    <div id="detail" hidden>
      <div class="concept-caption"><div><span id="concept-number"></span><h2 id="concept-title"></h2><p id="concept-description"></p></div><a id="image-link" href="#" target="_blank" rel="noopener">이미지 크게 보기 ↗</a></div>
      <section id="board" class="board" aria-label="선택한 대시보드 시안"></section>
    </div>
    <p class="review-foot">디자인 검토용 · 시안별 데이터 조회일 표시 · 모니터 시안은 열어서 애니메이션·상태색·축하 효과를 확인하세요.</p>
  </main>
  <script src="alternates.js"></script>
  <script src="new-67.js"></script>
  <script src="new-89.js"></script>
  <script src="more.js"></script>
  <script src="monitor.js"></script>

  <script src="stage-b.js"></script>
  <script src="stage-c.js"></script>
  <script src="stage-d.js"></script>
  <script src="app.js"></script>
  <button id="monitor-exit" class="monitor-exit">전체화면 종료 · Esc</button>
</body>
</html>
