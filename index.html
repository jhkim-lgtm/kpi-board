<style>
  :root{
    --bg:#0e0f13; --card:#17181d; --card2:#1c1e24; --line:#262830;

    --blue:#3d95f6; --gold:#b08d3e; --gold2:#d8bc7a; --kef:#4e86c8; --plus:#c4614a;
    --good:#4fc47f; --warn:#e0a83f; --bad:#e06b57;

  html,body{min-height:100%}
  body{

    position:relative;
  }
  .num{font-family:var(--numfont);font-variant-numeric:tabular-nums}

  .orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.16;pointer-events:none;z-index:0}
  .orb.a{width:520px;height:520px;background:var(--blue);top:-180px;right:-120px;animation:drift 26s ease-in-out infinite alternate}
  .orb.b{width:460px;height:460px;background:var(--plus);bottom:-200px;left:-140px;animation:drift 32s ease-in-out infinite alternate-reverse}
  .orb.c{width:360px;height:360px;background:var(--gold);top:45%;left:38%;opacity:.09;animation:drift 40s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.12)}}
  main{position:relative;z-index:1}

  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:4px}
  .brand{font-size:clamp(18px,1.7vw,24px);font-weight:800;letter-spacing:-.01em}
  .brand em{font-style:normal;color:var(--gold2)}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--good);
    background:#4fc47f1a;border:1px solid #4fc47f33;padding:5px 12px;border-radius:20px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:blink 1.6s ease-in-out infinite}
  .live.stale{color:var(--warn);background:#e0a83f1a;border-color:#e0a83f33}
  .live.stale i{background:var(--warn);animation:none}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .hspace{flex:1}
  #clock{font-size:clamp(20px,2vw,28px);font-weight:800}
  #clockdate{font-size:12px;color:var(--ink3);text-align:right}
  .meta{font-size:12px;color:var(--ink3);margin:4px 0 16px;display:flex;gap:16px;flex-wrap:wrap}
  .meta b{color:var(--ink2);font-weight:600}
  #banner{display:none;background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--warn);
    border-radius:14px;padding:11px 16px;font-size:13px;color:var(--ink2);margin-bottom:14px}
  #banner.show{display:block}

  .sect{display:flex;align-items:center;gap:14px;margin:22px 0 12px;flex-wrap:wrap}
  .sect h2{font-size:17px;font-weight:800;letter-spacing:.02em}
  .sect .tag{font-size:11px;font-weight:700;color:var(--blue);background:#3d95f61a;border:1px solid #3d95f633;
    padding:3px 10px;border-radius:14px}
  .sect .sub{font-size:12px;color:var(--ink3)}
  .sect .grow{flex:1}
  .sect .sum{font-size:14.5px;color:var(--ink2)}
  .sect .sum b{color:var(--ink);font-weight:800}
  .sect .sum .up{color:var(--good)}


  .grid{display:grid;gap:16px;grid-template-columns:repeat(3,1fr)}
  .grid.own{grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}
  @media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}

  .card{
    background:linear-gradient(160deg,var(--card2) 0%,var(--card) 55%);
    border:1px solid var(--line);border-radius:24px;padding:16px 20px 14px;
    position:relative;display:flex;flex-direction:column;gap:10px;
    box-shadow:0 16px 40px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.045);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
    transform-style:preserve-3d;
  }
  .card:hover{transform:perspective(900px) rotateX(2.5deg) rotateY(-2deg) translateY(-3px);
    box-shadow:0 26px 54px -26px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.06)}
  .card.near{border-color:color-mix(in srgb,var(--ac) 45%,var(--line));}
  .card.near::after{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;
    box-shadow:inset 0 0 40px -14px var(--ac);opacity:.5}

  .badge{position:absolute;top:14px;right:16px;width:58px;height:58px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:31px;
    background:radial-gradient(circle at 32% 26%, color-mix(in srgb,var(--ac) 55%,#fff) 0%, color-mix(in srgb,var(--ac) 45%,#000) 68%, color-mix(in srgb,var(--ac) 25%,#000) 100%);
    box-shadow:0 10px 20px -8px color-mix(in srgb,var(--ac) 65%,#000), inset 0 -5px 10px rgba(0,0,0,.4), inset 0 4px 7px rgba(255,255,255,.32);
    animation:bob 5.5s ease-in-out infinite;animation-delay:var(--d,0s)}
  .badge svg{width:33px;height:auto;border-radius:4px;box-shadow:0 2px 5px rgba(0,0,0,.5)}
  .badge span{filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}

  .eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);padding-right:66px;flex-wrap:wrap}
  .chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800;letter-spacing:.05em;
    color:#0e0f13;background:var(--ac)}
  .handle{color:var(--ink3);font-size:12px}

  .bignum{font-size:clamp(34px,3vw,58px);font-weight:800;line-height:1.05;letter-spacing:-.02em;
    display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .bignum .goal{font-size:.4em;color:var(--ink3);font-weight:600}
  .bignum.tick{animation:pop .55s ease}
  @keyframes pop{0%{text-shadow:0 0 22px var(--ac)}100%{text-shadow:none}}

  .pbar{height:13px;background:#262830;border-radius:5px;overflow:hidden}
  .pbar i{display:block;height:100%;border-radius:5px;
    background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 75%,#000),var(--ac));
    transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .prow{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2)}
  .prow .pct{font-weight:800;color:var(--ink)}

  .track{height:34px;border-radius:12px;background:#131419;border:1px solid #22242b;
    position:relative;overflow:hidden}
  .track::before{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:0;
    border-bottom:2px dashed #2b2d36}
  .runner{position:absolute;top:4px;left:100%;font-size:21px;line-height:1;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));

  .runner.flip{transform:scaleX(-1)}
  @keyframes run{from{left:calc(100% + 6px)}to{left:-34px}}
  .track.stop .runner{animation:none;left:12px;opacity:.4}
  .track .trail{position:absolute;top:12px;left:100%;font-size:10px;color:var(--ac);opacity:0;

  .eta.bad{color:var(--bad);border-color:#e06b5733}

  .sparkwrap{position:relative}
  .tip{position:absolute;pointer-events:none;background:#0a0b0e;border:1px solid var(--line);border-radius:8px;
    padding:4px 9px;font-size:11px;color:var(--ink2);white-space:nowrap;display:none;transform:translate(-50%,-115%)}
  .tip b{color:var(--ink)}
  .manual{font-size:11.5px;color:var(--ink3);background:#262830;border-radius:10px;padding:6px 10px;align-self:flex-start}

  footer{margin-top:18px;font-size:11.5px;color:var(--ink3);display:flex;gap:18px;flex-wrap:wrap}
  body.fit{overflow:hidden;height:100vh}
  body.fit footer{display:none}
  @media(prefers-reduced-motion:reduce){
    .pace i,.live i,.badge,.orb,.runner,.mile,.mile .drum,.card.hype::after{animation:none!important}

</style>

const S={}; let syncAt=null;

function bakeDates(vals){
  const out=[]; const d0=new Date(BAKE_START+"T10:00:00+09:00");
  vals.forEach((v,i)=>{ if(v!=null) out.push({d:new Date(d0.getTime()+i*86400000).toISOString().slice(0,10), v}); });
  return out;
}
function mergeSeries(base, hist){
  if(!hist||!hist.length) return base;
  const m=new Map(base.map(p=>[p.d,p.v]));
  hist.forEach(p=>{ if(p.v>0) m.set(p.d,p.v); });
  return [...m.entries()].map(([d,v])=>({d,v})).sort((a,b)=>a.d<b.d?-1:1);
}
function applySeries(k, pts, feedRow){
  const st=S[k.id]=S[k.id]||{};
  if(feedRow && feedRow.last && (!pts.length || feedRow.date>=pts[pts.length-1].d)){
    if(pts.length && pts[pts.length-1].d===feedRow.date) pts[pts.length-1]={d:feedRow.date,v:feedRow.last};
    else pts=[...pts,{d:feedRow.date,v:feedRow.last}];
  }
  st.series=pts.slice(-90);
  const last=pts[pts.length-1];
  st.last=last.v; st.lastDate=last.d;
  if(feedRow && feedRow.w7!=null){ st.rate=(feedRow.last-feedRow.w7)/7; }
  else{
    const cutoff=new Date(last.d).getTime()-7*86400000; let ref=pts[0];
    for(const p of pts){ if(new Date(p.d).getTime()<=cutoff) ref=p; }
    const days=Math.max(1,(new Date(last.d)-new Date(ref.d))/86400000);
    st.rate=(last.v-ref.v)/days;
  }
  st.d30 = feedRow&&feedRow.w30!=null ? feedRow.last-feedRow.w30 : null;
  st.baseTs=new Date(last.d+"T10:00:00+09:00").getTime();
}
function applyMonthly(k,months,current,asOf){
  const st=S[k.id]=S[k.id]||{};
  const mm=i=>"2026-"+String(i).padStart(2,"0")+"-28";
  st.series=months.map((v,i)=>({d:mm(i+2),v}));
  if(current!=null&&current>=(months[months.length-1]||0)){ st.series.push({d:asOf,v:current}); st.last=current; st.lastDate=asOf; }
  else{ st.last=months[months.length-1]; st.lastDate=mm(months.length+1); }
  const diffs=[]; for(let i=1;i<months.length;i++) diffs.push(months[i]-months[i-1]);
  st.rate=(diffs.length?diffs.reduce((a,b)=>a+b,0)/diffs.length:0)/30;
  st.d30=diffs.length?diffs[diffs.length-1]:null;
  st.baseTs=new Date(st.lastDate+"T10:00:00+09:00").getTime();
}
function loadBaked(){
  KPI.forEach(k=>{
    if(k.kind==="daily") applySeries(k,bakeDates(BAKED_AGENCY[k.idx]),null);
    else if(k.kind==="own") applySeries(k,bakeDates(BAKED_OWN[k.own]),null);
    else if(k.kind==="monthly"){ const b=BAKED_MONTHLY[k.row]; applyMonthly(k,b.months,b.current,b.asOf); }
    else if(k.kind==="static2") S[k.id]={series:null,last:k.subs.reduce((a,s)=>a+s.val,0),lastDate:k.asOf,rate:0,baseTs:Date.now(),subs:k.subs.map(s=>s.val)};
    else S[k.id]={series:null,last:k.val,lastDate:k.asOf,rate:0,baseTs:Date.now()};
  });
  KPI.forEach(k=>{ if(k.vk&&BAKED_VIEWS[k.id]) S[k.id].views=BAKED_VIEWS[k.id]; });
}

/* ── public feed fetch (gviz CSV · CORS OK) ── */
function parseCsv(t){
  return t.trim().split("\n").map(l=>{
    const cells=[]; let cur="",q=false;
    for(let i=0;i<l.length;i++){ const c=l[i];
      if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(c===","&&!q){ cells.push(cur); cur=""; }
      else cur+=c;
    }
    cells.push(cur); return cells;
  });
}
async function refresh(){
  try{
    const [ft,ht]=await Promise.all([
      fetch(FEED_CSV,{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("feed "+r.status); return r.text(); }),
      fetch(HIST_CSV,{cache:"no-store"}).then(r=>r.ok?r.text():"").catch(()=>""),
    ]);
    const feed={};
    parseCsv(ft).slice(1).forEach(r=>{ if(r[0]) feed[r[0]]={date:r[1],last:+String(r[2]).replace(/,/g,"")||null,
      w7:+String(r[3]).replace(/,/g,"")||null, w30:+String(r[4]).replace(/,/g,"")||null}; });
    const hist={};
    if(ht) parseCsv(ht).slice(1).forEach(r=>{ if(r[1]&&/^\d{4}-\d{2}-\d{2}$/.test(r[0]))
      (hist[r[1]]=hist[r[1]]||[]).push({d:r[0],v:+String(r[2]).replace(/,/g,"")||0}); });
    if(!Object.keys(feed).length) throw new Error("empty feed");
    KPI.forEach(k=>{
      const f=feed[k.feed];
      if(k.kind==="daily") applySeries(k, mergeSeries(bakeDates(BAKED_AGENCY[k.idx]),hist[k.feed]), f);
      else if(k.kind==="own") applySeries(k, mergeSeries(bakeDates(BAKED_OWN[k.own]),hist[k.feed]), f);
      else if(k.kind==="monthly"&&f&&f.last){
        const b=BAKED_MONTHLY[k.row];
        // 시트 월값과 BK 실측 중 큰 값 (구독자 최신값 우선)
        const cur=Math.max(f.last, b.current);
        applyMonthly(k, b.months, cur, cur===b.current?b.asOf:f.date);
      }
      else if(k.kind==="static2"){
        let tot=0, dt=null;
        k.subs.forEach((s,si)=>{ const fr=feed[s.key]; if(fr&&fr.last){ S[k.id].subs[si]=fr.last; dt=fr.date; } tot+=S[k.id].subs[si]||0; });
        if(dt){ S[k.id].last=tot; S[k.id].lastDate=dt; shown[k.id]=null;
          const m=document.querySelector("#c_"+k.id+" .manual");
          if(m) m.textContent="일 1회 자동 집계 · "+dt+" 기준"; }
      }
    });
    KPI.forEach(k=>{ if(k.vk&&feed[k.vk]&&feed[k.vk].last) S[k.id].views=feed[k.vk].last; });
    syncAt=Date.now(); hideBanner();
    document.getElementById("liveTxt").textContent="LIVE";
    renderStatic(); syncLabel();
  }catch(e){
    document.getElementById("liveTag").classList.add("stale");
    if(!syncAt) showBanner("피드 시트에 연결하지 못했습니다 — 네트워크 확인 후 자동으로 재시도합니다. (2026-07-28 스냅샷 표시 중)");
  }
}

function drawSpark(k){
  const st=S[k.id]; if(!st||!st.series) return;
  const cv=document.getElementById("sp_"+k.id); if(!cv) return;
  const w=cv.clientWidth||280,h=60,dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr;
  const x=cv.getContext("2d"); x.scale(dpr,dpr); x.clearRect(0,0,w,h);
  const pts=st.series; if(pts.length<2) return;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=(mx-mn)||1;
  const X=i=>3+(w-6)*i/(pts.length-1), Y=v=>4+(h-9)*(1-(v-mn)/sp);
  const col=k.ac;
  const path=()=>{ x.beginPath(); x.moveTo(X(0),Y(pts[0].v));
    for(let i=1;i<pts.length;i++){ const xc=(X(i-1)+X(i))/2, yc=(Y(pts[i-1].v)+Y(pts[i].v))/2; x.quadraticCurveTo(X(i-1),Y(pts[i-1].v),xc,yc); }
    x.lineTo(X(pts.length-1),Y(pts[pts.length-1].v)); };
  path(); x.lineTo(X(pts.length-1),h); x.lineTo(X(0),h); x.closePath();
  const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,col+"66"); g.addColorStop(1,col+"08");
  x.fillStyle=g; x.fill();
  x.save(); x.shadowColor=col; x.shadowBlur=9;
  path(); x.strokeStyle=col; x.lineWidth=2.5; x.lineJoin="round"; x.stroke(); x.restore();
  const li=pts.length-1;
  x.beginPath(); x.arc(X(li),Y(pts[li].v),4,0,7); x.fillStyle=col; x.fill();
  x.beginPath(); x.arc(X(li),Y(pts[li].v),4,0,7); x.strokeStyle="#0e0f13"; x.lineWidth=2; x.stroke();
  cv.onmousemove=ev=>{
    const r=cv.getBoundingClientRect();
    const i=Math.max(0,Math.min(pts.length-1,Math.round((ev.clientX-r.left-4)/((w-8)/(pts.length-1)))));
    const tp=document.getElementById("tp_"+k.id);
    tp.style.display="block"; tp.style.left=X(i)+"px"; tp.style.top=Y(pts[i].v)+"px";
    tp.innerHTML=`${pts[i].d} · <b>${pts[i].v.toLocaleString()}</b>`;
  };
  cv.onmouseleave=()=>{const t=document.getElementById("tp_"+k.id); if(t)t.style.display="none"};
}
function speedTier(r){
  if(r<=0.2) return {em:"🧍",label:"정지",move:false,flip:false};
  if(r<3)    return {em:"🐢",label:"거북이",move:true,flip:false};
  if(r<10)   return {em:"🚶",label:"걷기",move:true,flip:false};
  if(r<30)   return {em:"🏃",label:"달리기",move:true,flip:false};
  if(r<80)   return {em:"🚴",label:"자전거",move:true,flip:false};
  if(r<150)  return {em:"🚗",label:"자동차",move:true,flip:false};
  if(r<300)  return {em:"✈️",label:"비행기",move:true,flip:true};
  if(r<600)  return {em:"🚀",label:"제트기",move:true,flip:true};
  return {em:"⚡",label:"빛의 속도",move:true,flip:false};
}
function humanEvery(sec){
  if(sec<90) return Math.round(sec)+"초";
  if(sec<5400) return Math.round(sec/60)+"분";
  if(sec<172800) return (sec/3600).toFixed(1).replace(/\.0$/,"")+"시간";
  return Math.round(sec/86400)+"일";
}

function renderStatic(){
  let latest="";
  KPI.forEach(k=>{
    const st=S[k.id];
    if(k.kind==="static2"){
      if(k.subs&&st.subs) k.subs.forEach((s,si)=>{ const e=document.getElementById("x_"+k.id+"_"+si); if(e&&st.subs[si]!=null) e.textContent=st.subs[si].toLocaleString("ko-KR"); });
      return;
    }
    if(k.vk){ const ve=document.getElementById("v_"+k.id);
      if(ve) ve.innerHTML = st.views? `👁 월간 조회수 <b>${fmtViews(st.views)}</b>` : ""; }
    if(k.goal){
      const pct=Math.min(100,st.last/k.goal*100);
      document.getElementById("b_"+k.id).style.width=pct.toFixed(1)+"%";
      document.getElementById("p_"+k.id).textContent=pct.toFixed(1)+"%";
      document.getElementById("r_"+k.id).textContent="남은 "+(k.goal-st.last>0?fmt(k.goal-st.last):0);
      document.getElementById("c_"+k.id).classList.toggle("near",pct>=85);
      const e=document.getElementById("e_"+k.id), remain=k.goal-st.last, r=st.rate;
      if(remain<=0){ e.className="eta ok"; e.textContent="✦ 목표 달성!"; }
      else if(r<=0.2){ e.className="eta bad"; e.textContent="⏸ 정체 — 부스트 필요"; }
      else{
        const dt=new Date(Date.now()+remain/r*86400000), y=dt.getFullYear();
        const label=`${y}.${String(dt.getMonth()+1).padStart(2,"0")} 도달 예상`;
        if(y===2026){ e.className="eta ok"; e.textContent="◉ 이 속도면 "+label; }
        else if(y===2027){ e.className="eta warn"; e.textContent="◔ "+label+" — 속도 상향 필요"; }
        else{ e.className="eta bad"; e.textContent="○ 현 속도로는 "+y+"년 — 전략 필요"; }
      }
    }
    const mel=document.getElementById("m_"+k.id), cardEl=document.getElementById("c_"+k.id);
    if(mel){
      const next=MILES.find(m=>m>st.last);
      const days=(st.rate>0&&next)? (next-st.last)/st.rate : Infinity;
      if(days<=14){
        mel.style.display="inline-flex";
        mel.innerHTML=`<span class="drum">🥁</span> ${fmtViews(next)} 돌파 임박! <b>D-${Math.max(1,Math.ceil(days))}</b>`;
        cardEl.classList.add("hype");
      } else { mel.style.display="none"; cardEl.classList.remove("hype"); }
    }
    const s=document.getElementById("s_"+k.id), r=st.rate;
    const unit=k.kind==="monthly"?"월":"일", rv=k.kind==="monthly"?r*30:r;
    const cls=rv>0.5?"up":(rv<-0.5?"down":"flat"), arrow=rv>0.5?"▲":(rv<-0.5?"▼":"―");
    let extra="";
    if(st.d30!=null&&k.kind!=="monthly") extra=`<span class="s" style="color:var(--ink3)">30일 ${st.d30>=0?"+":""}${st.d30.toLocaleString()}</span>`;
    const tier=speedTier(r);
    s.innerHTML=`<span class="s ${cls}">${arrow} <b>${rv>0?"+":""}${Math.round(rv).toLocaleString()}</b>/${unit}</span>`
      +`<span class="s tierlab">${tier.em} <b>${tier.label}</b></span>`
      +(r>0.2?`<span class="s" style="color:var(--ink3)">${humanEvery(86400/r)}마다 +1</span>`:"")+extra;
    const tk=document.getElementById("tk_"+k.id), rn=document.getElementById("rn_"+k.id);
    rn.textContent=tier.em; rn.classList.toggle("flip",tier.flip);
    if(tier.move){
      tk.classList.remove("stop");
      const dur=Math.max(2.2,Math.min(11,50/Math.sqrt(Math.max(r,0.3))));
      tk.style.setProperty("--dur",dur.toFixed(2)+"s");
      tk.classList.toggle("fast",r>=150);
    } else { tk.classList.add("stop"); tk.classList.remove("fast"); }
    if(st.lastDate>latest&&k.kind!=="monthly") latest=st.lastDate;
    drawSpark(k);
  });
  document.getElementById("dataDate").textContent=latest+" 10:00 KST";
  const own=KPI.filter(k=>k.sec==="own");
  const osum=own.reduce((a,k)=>a+S[k.id].last,0);
  const orate=own.reduce((a,k)=>a+Math.max(0,S[k.id].rate||0),0);
  document.getElementById("ownSum").innerHTML=`<b>${fmt(osum)}</b> 팔로워 <span class="up">▲ +${Math.round(orate).toLocaleString()}/일</span>`;
  if(typeof fitScreen==="function"){ clearTimeout(window.__ft); window.__ft=setTimeout(fitScreen,60); }
}

/* ── live ticker ── */
const shown={};
function tick(){
  const now=Date.now();
  KPI.forEach(k=>{
    const st=S[k.id]; if(!st) return;
    const el=document.getElementById("n_"+k.id);
    if(k.kind==="static2"){ if(shown[k.id]!==st.last){ shown[k.id]=st.last; el.textContent=st.last.toLocaleString("ko-KR"); } return; }
    const gain=st.rate>0? st.rate*Math.max(0,(now-st.baseTs)/1000)/86400 : 0;
    const iv=Math.floor(st.last+gain);
    if(shown[k.id]!==iv){
      if(shown[k.id]!=null&&iv>shown[k.id]){ const b=el.parentElement; b.classList.remove("tick"); void b.offsetWidth; b.classList.add("tick"); }
      shown[k.id]=iv; el.textContent=iv.toLocaleString("ko-KR");
    }
    const td=document.getElementById("t_"+k.id);
    if(st.rate>0.2){
      td.className="today num"; td.innerHTML=`오늘 예상 <b>+${gain.toFixed(2)}</b>`;
    } else { td.className="today num zero"; td.textContent=st.rate<-0.5?"최근 감소 추세 — 실측 기준 유지":""; }
  });
}
setInterval(tick,200);

/* ── fit-to-screen: 어떤 모니터 비율에서도 전체 정보가 잘리지 않게 자동 축척 ── */
function fitScreen(){
  const m=document.querySelector("main"); if(!m) return;
  if(window.innerWidth<1200){ document.body.classList.remove("fit"); m.style.transform=""; m.style.width=""; KPI.forEach(drawSpark); return; }
  const availH=window.innerHeight-40;
  let s=1;
  for(let i=0;i<3;i++){
    m.style.width=s<1?(100/s)+"%":"";
    m.style.transform="";
    const ns=Math.min(1, availH/m.scrollHeight);
    if(Math.abs(ns-s)<0.005){ s=ns; break; }
    s=ns;
  }
  if(s<0.999){
    m.style.width=(100/s)+"%";
    m.style.transformOrigin="top left";
    m.style.transform=`scale(${s})`;
    document.body.classList.add("fit");
  } else {
    m.style.width=""; m.style.transform="";
    document.body.classList.remove("fit");
  }
  KPI.forEach(drawSpark);
}
window.addEventListener("resize",()=>{ clearTimeout(window.__ft); window.__ft=setTimeout(fitScreen,120); });
setTimeout(fitScreen,80);
</script>
</body>
